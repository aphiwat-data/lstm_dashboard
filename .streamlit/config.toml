[client]
toolbarMode = "minimal"

# One design system for the whole dashboard (native Streamlit theming only, no custom CSS).
# A single light theme on purpose: with both [theme.light] and [theme.dark], Streamlit follows each visitor's system
# setting and offers no way to make light the default.
[theme]
base = "light"
baseFontSize = 14
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
metricValueFontSize = "1.75rem"
# h1 is the forecast price, h2 the page title, h3 section headings
headingFontSizes = ["2.9rem", "1.6rem", "1.25rem", "1.05rem", "0.95rem", "0.85rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
primaryColor = "#1F5FBF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F9"
textColor = "#101828"
borderColor = "#E3E7EE"
redColor = "#D92D20"
orangeColor = "#DC6803"
yellowColor = "#CA8504"
blueColor = "#2A78D6"
greenColor = "#12A150"
grayColor = "#98A2B3"

[theme.sidebar]
backgroundColor = "#F3F5F9"
secondaryBackgroundColor = "#E8ECF3"
